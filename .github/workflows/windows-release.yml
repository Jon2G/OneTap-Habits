name: Windows Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.3.0)'
        required: true
        default: '1.3.0'

env:
  DOTNET_VERSION: '9.0.317'
  PROJECT_PATH: 'src/OneTapHabits.csproj'

jobs:
  build-windows:
    permissions: write-all
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare firebase-config.json
        run: |
          $secret = "${{ secrets.FIREBASE_CONFIG_JSON_BASE64 }}"
          if (-not [string]::IsNullOrWhiteSpace($secret)) {
            $jsonBytes = [Convert]::FromBase64String($secret)
            [IO.File]::WriteAllBytes("src/firebase-config.json", $jsonBytes)
            Write-Host "firebase-config.json created from secret."
          } else {
            Copy-Item "src/firebase-config.json.example" "src/firebase-config.json"
            Write-Host "Using firebase-config.json.example (secret not configured)."
          }
        shell: pwsh

      - name: Apply MAUI CI SDK pin
        run: Copy-Item global.maui.ci.json global.json
        shell: pwsh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Restore workloads
        run: |
          dotnet workload config --update-mode workload-set
          dotnet workload restore ${{ env.PROJECT_PATH }} -p:TargetFramework=net9.0-windows10.0.22000.0
        shell: pwsh

      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.PROJECT_PATH }} -p:TargetFramework=net9.0-windows10.0.22000.0
          dotnet restore src/OneTapHabits.Core/OneTapHabits.Core.csproj
        shell: pwsh

      - name: Prepare signing certificate
        run: |
          $secret = "${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}"
          if (-not [string]::IsNullOrWhiteSpace($secret)) {
            [IO.File]::WriteAllBytes("src/windows-signing.pfx", [Convert]::FromBase64String($secret))
            Write-Host "windows-signing.pfx created from secret."
          } else {
            Write-Error "WINDOWS_SIGNING_PFX_BASE64 secret is required for signed MSIX releases."
            exit 1
          }
        shell: pwsh

      - name: Get version from tag
        id: get_version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            $version = "${{ github.ref_name }}".TrimStart('v')
            echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Build Windows Release MSIX
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          $parts = $ver -split '\.'
          $vc = [int]$parts[0] * 10000 + [int]$parts[1] * 100 + [int]$parts[2]
          dotnet publish ${{ env.PROJECT_PATH }} -f net9.0-windows10.0.22000.0 -c Release -p:ApplicationVersion=$vc -p:ApplicationDisplayVersion=$ver -p:WindowsPackageType=MSIX -p:AppxPackageSigningEnabled=true -p:PackageCertificateKeyFile=windows-signing.pfx -p:PackageCertificatePassword=$env:WINDOWS_SIGNING_PASSWORD
        shell: pwsh
        env:
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}

      - name: Collect MSIX artifacts
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts | Out-Null
          $msix = Get-ChildItem -Path ./src/bin/Release/net9.0-windows10.0.22000.0 -Filter *.msix -Recurse | Select-Object -First 1
          if (-not $msix) {
            Write-Error "MSIX not found after publish."
            exit 1
          }
          $sig = Get-AuthenticodeSignature $msix.FullName
          if ($sig.Status -ne 'Valid') {
            Write-Error "MSIX signature is not valid: $($sig.Status)"
            exit 1
          }
          $dest = "./artifacts/OneTapHabits-v${{ steps.get_version.outputs.VERSION }}.msix"
          Copy-Item $msix.FullName $dest
          $pfx = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2('src/windows-signing.pfx', $env:WINDOWS_SIGNING_PASSWORD, 'Exportable')
          Export-Certificate -Cert $pfx -FilePath ./artifacts/OneTapHabits-windows-signing.cer | Out-Null
          Write-Host "Published signed MSIX: $dest"
        shell: pwsh
        env:
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}

      - name: Upload MSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: ./artifacts/*.msix
          retention-days: 30

      - name: Attach MSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: OneTap Habits v${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            ./artifacts/*.msix
            ./artifacts/*.cer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

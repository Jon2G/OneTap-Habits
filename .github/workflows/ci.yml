name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'global.json'
      - 'global.ci.json'
      - 'global.maui.ci.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/android-release.yml'
      - '.github/workflows/windows-release.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'global.json'
      - 'global.ci.json'
      - 'global.maui.ci.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/android-release.yml'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '9.0.317'
  PROJECT_PATH: src/OneTapHabits.csproj

jobs:
  build:
    name: Build MAUI Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply MAUI CI SDK pin
        run: cp global.maui.ci.json global.json

      - name: Prepare google-services.json
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > src/google-services.json
          else
            cp src/google-services.json.example src/google-services.json
          fi
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 17

      - name: Restore workloads
        run: |
          dotnet workload config --update-mode workload-set
          dotnet workload restore ${{ env.PROJECT_PATH }}

      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.PROJECT_PATH }} -p:TargetFramework=net9.0-android
          dotnet restore src/OneTapHabits.Core/OneTapHabits.Core.csproj

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} -f net9.0-android -c Debug --no-restore

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Apply CI SDK pin
        run: cp global.ci.json global.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Test
        run: dotnet test tests/OneTapHabits.Tests/OneTapHabits.Tests.csproj -c Release --verbosity minimal

  build-windows:
    name: Build MAUI Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Apply MAUI CI SDK pin
        run: cp global.maui.ci.json global.json
        shell: bash

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Prepare firebase-config.json
        run: |
          if (-not [string]::IsNullOrWhiteSpace("${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}")) {
            $jsonBytes = [Convert]::FromBase64String("${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}")
            [IO.File]::WriteAllBytes("src/google-services.json", $jsonBytes)
          }

          ./scripts/windows/prepare-firebase-config.ps1
        shell: pwsh

      - name: Restore workloads
        run: |
          dotnet workload config --update-mode workload-set
          dotnet workload restore ${{ env.PROJECT_PATH }} -p:TargetFramework=net9.0-windows10.0.22000.0
        shell: pwsh

      - name: Build Windows
        run: dotnet build ${{ env.PROJECT_PATH }} -f net9.0-windows10.0.22000.0 -c Debug
        shell: pwsh
